.gate-input:focus { border-color: var(--shadow-input-focus); }

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyC1YcnEOe71OCz__K3-y-B16aKacjUxmnDv2Au8walQIlitqlB4JpNfIqazREciIDj/exec';
const PASSWORD = 'odist00154*';
const AUTH_KEY = 'odist_auth_v1';
const AUTH_VALUE = 'authenticated_2026';
const THEME_KEY = 'odist_theme_v2';

const RANK_OF = { S:'exec',T:'exec', P:'director',L:'director', D:'manager', K:'senior',J:'senior', C:'staff',H:'staff' };
const RANK_ORDER = { S:1,T:2,P:3,L:4,D:5,K:6,J:7,C:8,H:9 };
const TYPE_ORDER = { overseas:1, domestic:2, office:3, rest:4 };
const RANK_CLASSES = ['rank-exec','rank-director','rank-manager','rank-senior','rank-staff'];
const CHIP_COLORS_LIGHT = { exec:'#1A1A1A', director:'#5F5E5A', manager:'#534AB7', senior:'#3B6D11', staff:'#BA7517' };
const CHIP_COLORS_DARK = { exec:'#000000', director:'#7A7A75', manager:'#6E63D5', senior:'#4F8B22', staff:'#D08820' };
const DOW_NAMES = ['일','월','화','수','목','금','토'];
const MAX_ENTRIES = 5;
const TESLA_REGEX = /\s*\(\s*테슬라\s*\)\s*/g;
const J_START_DATE = new Date(2026, 5, 1);

let SCHEDULE_DATA = null;
let ACTIVE = new Set();
let prevViewMode = 'month';
let viewMode = 'month';
let detailDate = null;
let currentDate = new Date();
let currentTheme = 'light';

function getChipColors() {
  return currentTheme === 'dark' ? CHIP_COLORS_DARK : CHIP_COLORS_LIGHT;
}
function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0F0E' : '#FAFAF9');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀' : '☾';
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
function loadTheme() {
  let theme = null;
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') theme = saved;
  } catch (e) {}
  if (!theme) {
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const listener = function(e) {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
      if (saved !== 'dark' && saved !== 'light') {
        applyTheme(e.matches ? 'dark' : 'light');
        if (SCHEDULE_DATA) render();
      }
    };
    if (mq.addEventListener) mq.addEventListener('change', listener);
    else if (mq.addListener) mq.addListener(listener);
  }
}
function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  if (SCHEDULE_DATA) render();
}

function isAuthenticated() {
  try { return localStorage.getItem(AUTH_KEY) === AUTH_VALUE; } catch (e) { return false; }
}
function setAuthenticated() {
  try { localStorage.setItem(AUTH_KEY, AUTH_VALUE); } catch (e) {}
}
function showGate() {
  document.getElementById('gateWrap').style.display = 'flex';
  setTimeout(function(){
    const inp = document.getElementById('gateInput');
    if (inp) inp.focus();
  }, 100);
}
function hideGate() {
  document.getElementById('gateWrap').style.display = 'none';
}
function tryAuth() {
  const inp = document.getElementById('gateInput');
  const errEl = document.getElementById('gateError');
  if (inp.value === PASSWORD) {
    setAuthenticated();
    hideGate();
    startApp();
  } else {
    inp.classList.add('error');
    errEl.textContent = '비밀번호가 올바르지 않습니다';
    setTimeout(function(){ inp.classList.remove('error'); }, 500);
    inp.value = '';
    inp.focus();
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isSameDay(d1, d2) {
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}
function dateLabel(s) {
  const parts = s.split('/').map(Number);
  const d = new Date(currentDate.getFullYear(), parts[0]-1, parts[1]);
  return parts[0] + '월 ' + parts[1] + '일 (' + DOW_NAMES[d.getDay()] + ')';
}
function parseVehicle(text) {
  TESLA_REGEX.lastIndex = 0;
  if (TESLA_REGEX.test(text)) {
    return { text: text.replace(TESLA_REGEX, ' ').trim().replace(/\s+/g, ' '), hasVehicle: true };
  }
  return { text: text, hasVehicle: false };
}
function processData(data) {
  Object.keys(data).forEach(function(p) {
    Object.keys(data[p]).forEach(function(date) {
      data[p][date] = data[p][date].map(function(item) {
        const parsed = parseVehicle(item.text);
        return { text: parsed.text, type: item.type, hasVehicle: parsed.hasVehicle };
      });
    });
  });
  return data;
}
function isPersonActiveOnDate(person, dateStr) {
  if (person !== 'J') return true;
  const parts = dateStr.split('/').map(Number);
  const d = new Date(currentDate.getFullYear(), parts[0]-1, parts[1]);
  return d >= J_START_DATE;
}
function getActivePersonsForView() {
  if (!SCHEDULE_DATA) return [];
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth() + 1;
  const lastDayOfMonth = new Date(year, month, 0).getDate();
  const monthStart = new Date(year, month-1, 1);
  const monthEnd = new Date(year, month-1, lastDayOfMonth);
  return SCHEDULE_DATA.persons.filter(function(p){
    if (p !== 'J') return true;
    return monthEnd >= J_START_DATE;
  });
}
function isAllOn() {
  if (!SCHEDULE_DATA) return false;
  const persons = getActivePersonsForView();
  if (ACTIVE.size !== persons.length) return false;
  return persons.every(function(p){ return ACTIVE.has(p); });
}
function getEntriesForDate(date, personSet) {
  const entries = [];
  personSet.forEach(function(p){
    if (!RANK_OF[p]) return;
    if (!isPersonActiveOnDate(p, date)) return;
    const items = (SCHEDULE_DATA.data[p] && SCHEDULE_DATA.data[p][date]) || [];
    if (items.length === 0) {
      const ex = entries.find(function(e){ return e.text === '미정'; });
      if (ex) ex.persons.push(p);
      else entries.push({persons:[p], text:'미정', type:'rest', isUndecided:true, vehiclePersons:new Set()});
    } else {
      items.forEach(function(item){
        const ex = entries.find(function(e){ return e.text === item.text && e.type === item.type; });
        if (ex) {
          ex.persons.push(p);
          if (item.hasVehicle) ex.vehiclePersons.add(p);
        } else {
          const ent = {persons:[p], text:item.text, type:item.type, vehiclePersons:new Set()};
          if (item.hasVehicle) ent.vehiclePersons.add(p);
          entries.push(ent);
        }
      });
    }
  });
  entries.forEach(function(e){
    e.persons.sort(function(a,b){ return RANK_ORDER[a] - RANK_ORDER[b]; });
  });
  entries.sort(function(a,b){
    if (a.isUndecided && !b.isUndecided) return 1;
    if (!a.isUndecided && b.isUndecided) return -1;
    return TYPE_ORDER[a.type] - TYPE_ORDER[b.type];
  });
  return entries;
}
function chipHtml(p, big, hasVehicle) {
  const cls = big ? 'detail-chip' : 'chip';
  const vCls = hasVehicle ? ' has-vehicle' : '';
  const colors = getChipColors();
  return '<span class="' + cls + vCls + '" style="background:' + colors[RANK_OF[p]] + '">' + p + '</span>';
}
function getWeekStart(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function getWeekRangeLabel() {
  const start = getWeekStart(currentDate);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  if (start.getMonth() === end.getMonth()) {
    return start.getFullYear() + '년 ' + (start.getMonth()+1) + '월 ' + start.getDate() + '일 ~ ' + end.getDate() + '일';
  }
  return start.getFullYear() + '년 ' + (start.getMonth()+1) + '/' + start.getDate() + ' ~ ' + (end.getMonth()+1) + '/' + end.getDate();
}
function renderTabsAndControls() {
  const allOn = isAllOn();
  const activePersons = new Set(getActivePersonsForView());
  let html = '<div class="tabs-wrap"><div class="tab-row">';
  const allTabCls = allOn ? ' all-selected' : '';
  html += '<div class="all-cluster"><button class="all-tab' + (allOn ? ' is-on' : '') + allTabCls + '" id="allBtn">ALL</button></div>';
  SCHEDULE_DATA.rankGroups.forEach(function(group, idx) {
    const groupActive = group.filter(function(p){ return activePersons.has(p); });
    const buttons = groupActive.map(function(p){
      const selected = ACTIVE.has(p);
      const cls = selected ? ' all-selected' : ' inactive';
      return '<button class="person-tab' + cls + '" data-p="' + p + '">' + p + '</button>';
    }).join('');
    if (buttons) {
      html += '<div class="rank-cluster ' + RANK_CLASSES[idx] + '">' + buttons + '</div>';
    }
  });
  html += '</div></div>';
  const rangeLabel = viewMode === 'week' ? getWeekRangeLabel() : currentDate.getFullYear() + '년 ' + (currentDate.getMonth()+1) + '월';
  html += '<div class="controls">';
  html += '<div class="range-label">' + rangeLabel + '</div>';
  html += '<div class="controls-right">';
  html += '<div class="view-toggle">';
  html += '<button class="view-toggle-btn' + (viewMode === 'month' ? ' is-on' : '') + '" id="monthViewBtn">월</button>';
  html += '<button class="view-toggle-btn' + (viewMode === 'week' ? ' is-on' : '') + '" id="weekViewBtn">주</button>';
  html += '</div>';
  html += '<button class="nav-btn nav-arrow" id="prevBtn">‹</button>';
  html += '<button class="nav-btn" id="todayBtn">오늘</button>';
  html += '<button class="nav-btn nav-arrow" id="refreshBtn" title="최신 데이터">↻</button>';
  html += '<button class="nav-btn nav-arrow" id="nextBtn">›</button>';
  html += '</div></div>';
  return html;
}
function renderMonth() {
  let topHtml = '<div class="sticky-header">' + renderTabsAndControls();
  if (ACTIVE.size === 0) {
    topHtml += '</div>';
    document.getElementById('fixedHeaderArea').innerHTML = topHtml;
    document.getElementById('mainArea').innerHTML = '<div class="no-active">표시할 직원이 없습니다.<br><small>탭을 누르거나 "ALL"을 클릭하세요.</small></div>';
    attachHandlers();
    return;
  }
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const today = new Date();
  const firstDay = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month+1, 0);
  const daysInMonth = lastDay.getDate();
  const emptyBefore = firstDay === 0 ? 6 : firstDay - 1;
  topHtml += '<div class="dow-row">' +
    '<div class="dow">월</div><div class="dow">화</div><div class="dow">수</div>' +
    '<div class="dow">목</div><div class="dow">금</div>' +
    '<div class="dow weekend">토</div><div class="dow weekend">일</div>' +
    '</div></div>';
  let bodyHtml = '<div class="month-grid">';
  for (let i = 0; i < emptyBefore; i++) bodyHtml += '<div class="day-cell empty"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const dow = d.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = isSameDay(d, today);
    const key = (month+1) + '/' + day;
    const entries = getEntriesForDate(key, ACTIVE);
    const visible = entries.slice(0, MAX_ENTRIES);
    const hidden = entries.length - MAX_ENTRIES;
    const pillsHtml = visible.map(function(e){
      const chips = e.persons.map(function(p){
        return chipHtml(p, false, e.vehiclePersons && e.vehiclePersons.has(p));
      }).join('');
      const undecCls = e.isUndecided ? ' undecided' : '';
      return '<div class="entry">' +
        '<div class="entry-chips">' + chips + '</div>' +
        '<div class="entry-text' + undecCls + '">' + escapeHtml(e.text) + '</div>' +
        '</div>';
    }).join('');
    const moreHtml = hidden > 0 ? '<div class="more-row">··· +' + hidden + '</div>' : '';
    bodyHtml += '<div class="day-cell' + (isToday ? ' today' : '') + '" data-date="' + key + '">' +
      '<div class="day-num' + (isWeekend ? ' weekend' : '') + '">' + day + '</div>' +
      pillsHtml + moreHtml +
      '</div>';
  }
  bodyHtml += '</div>';
  document.getElementById('fixedHeaderArea').innerHTML = topHtml;
  document.getElementById('mainArea').innerHTML = bodyHtml;
  attachHandlers();
  document.querySelectorAll('.day-cell[data-date]').forEach(function(c){
    c.addEventListener('click', function(){
      prevViewMode = viewMode;
      viewMode = 'detail';
      detailDate = c.dataset.date;
      render();
    });
  });
}
function renderWeek() {
  const topHtml = '<div class="sticky-header">' + renderTabsAndControls() + '</div>';
  document.getElementById('fixedHeaderArea').innerHTML = topHtml;
  if (ACTIVE.size === 0) {
    document.getElementById('mainArea').innerHTML = '<div class="no-active">표시할 직원이 없습니다.<br><small>탭을 누르거나 "ALL"을 클릭하세요.</small></div>';
    attachHandlers();
    return;
  }
  const today = new Date();
  const weekStart = getWeekStart(currentDate);
  const colors = getChipColors();
  let bodyHtml = '<div class="week-list">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const dow = d.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = isSameDay(d, today);
    const key = (d.getMonth()+1) + '/' + d.getDate();
    const entries = getEntriesForDate(key, ACTIVE);
    bodyHtml += '<div class="week-day' + (isToday ? ' today' : '') + '" data-date="' + key + '">';
    bodyHtml += '<div class="week-day-header">';
    bodyHtml += '<span class="week-day-num' + (isWeekend ? ' weekend' : '') + '">' + (d.getMonth()+1) + '/' + d.getDate() + '</span>';
    bodyHtml += '<span class="week-day-dow' + (isWeekend ? ' weekend' : '') + '">(' + DOW_NAMES[dow] + ')</span>';
    bodyHtml += '</div>';
    if (entries.length === 0) {
      bodyHtml += '<div class="week-day-empty">일정 없음</div>';
    } else {
      entries.forEach(function(e){
        const chips = e.persons.map(function(p){
          const vCls = (e.vehiclePersons && e.vehiclePersons.has(p)) ? ' has-vehicle' : '';
          return '<span class="week-entry-chip' + vCls + '" style="background:' + colors[RANK_OF[p]] + '">' + p + '</span>';
        }).join('');
        const undecCls = e.isUndecided ? ' undecided' : '';
        bodyHtml += '<div class="week-entry">';
        bodyHtml += '<div class="week-entry-chips">' + chips + '</div>';
        bodyHtml += '<div class="week-entry-text' + undecCls + '">' + escapeHtml(e.text) + '</div>';
        bodyHtml += '</div>';
      });
    }
    bodyHtml += '</div>';
  }
  bodyHtml += '</div>';
  document.getElementById('mainArea').innerHTML = bodyHtml;
  attachHandlers();
  document.querySelectorAll('.week-day[data-date]').forEach(function(c){
    c.addEventListener('click', function(){
      prevViewMode = viewMode;
      viewMode = 'detail';
      detailDate = c.dataset.date;
      render();
    });
  });
}
function renderDetail() {
  const entries = getEntriesForDate(detailDate, new Set(SCHEDULE_DATA.persons));
  let topHtml = '<div class="detail-header">';
  topHtml += '<div id="backBtn" class="back-btn" role="button" tabindex="0">← 뒤로</div>';
  topHtml += '<div class="detail-title">' + dateLabel(detailDate) + '</div>';
  topHtml += '<div class="detail-nav">';
  topHtml += '<button class="detail-nav-btn" id="detailPrevBtn">‹</button>';
  topHtml += '<button class="detail-nav-btn" id="detailNextBtn">›</button>';
  topHtml += '</div>';
  topHtml += '</div>';
  let bodyHtml = '<div class="detail-list" style="padding-top:16px;">';
  entries.forEach(function(e){
    const chips = e.persons.map(function(p){
      return chipHtml(p, true, e.vehiclePersons && e.vehiclePersons.has(p));
    }).join('');
    const undecCls = e.isUndecided ? ' undecided' : '';
    bodyHtml += '<div class="detail-row">' +
      '<div class="detail-chips">' + chips + '</div>' +
      '<div class="detail-text' + undecCls + '">' + escapeHtml(e.text) + '</div>' +
      '</div>';
  });
  bodyHtml += '</div>';
  document.getElementById('fixedHeaderArea').innerHTML = topHtml;
  document.getElementById('mainArea').innerHTML = bodyHtml;
  document.getElementById('backBtn').addEventListener('click', function(){
    viewMode = prevViewMode || 'month';
    render();
  });
  document.getElementById('detailPrevBtn').addEventListener('click', function(){
    shiftDetailDate(-1);
  });
  document.getElementById('detailNextBtn').addEventListener('click', function(){
    shiftDetailDate(1);
  });
}
function shiftDetailDate(delta) {
  const parts = detailDate.split('/').map(Number);
  const d = new Date(currentDate.getFullYear(), parts[0]-1, parts[1]);
  d.setDate(d.getDate() + delta);
  detailDate = (d.getMonth()+1) + '/' + d.getDate();
  if (d.getMonth() !== currentDate.getMonth() || d.getFullYear() !== currentDate.getFullYear()) {
    currentDate = new Date(d);
  }
  render();
}
function attachHandlers() {
  document.querySelectorAll('.person-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      const p = btn.dataset.p;
      if (isAllOn()) ACTIVE = new Set([p]);
      else if (ACTIVE.has(p)) ACTIVE.delete(p);
      else ACTIVE.add(p);
      render();
    });
  });
  const allBtn = document.getElementById('allBtn');
  if (allBtn) allBtn.addEventListener('click', function(){
    if (isAllOn()) {
      ACTIVE = new Set();
    } else {
      ACTIVE = new Set(getActivePersonsForView());
    }
    render();
  });
  const monthViewBtn = document.getElementById('monthViewBtn');
  if (monthViewBtn) monthViewBtn.addEventListener('click', function(){
    viewMode = 'month';
    render();
  });
  const weekViewBtn = document.getElementById('weekViewBtn');
  if (weekViewBtn) weekViewBtn.addEventListener('click', function(){
    viewMode = 'week';
    render();
  });
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.addEventListener('click', function(){
    const wasAllOn = isAllOn();
    if (viewMode === 'week') {
      currentDate.setDate(currentDate.getDate() - 7);
    } else {
      currentDate.setDate(1);
      currentDate.setMonth(currentDate.getMonth() - 1);
    }
    if (wasAllOn) ACTIVE = new Set(getActivePersonsForView());
    render();
  });
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) nextBtn.addEventListener('click', function(){
    const wasAllOn = isAllOn();
    if (viewMode === 'week') {
      currentDate.setDate(currentDate.getDate() + 7);
    } else {
      currentDate.setDate(1);
      currentDate.setMonth(currentDate.getMonth() + 1);
    }
    if (wasAllOn) ACTIVE = new Set(getActivePersonsForView());
    render();
  });
  const todayBtn = document.getElementById('todayBtn');
  if (todayBtn) todayBtn.addEventListener('click', function(){
    const wasAllOn = isAllOn();
    currentDate = new Date();
    if (wasAllOn) ACTIVE = new Set(getActivePersonsForView());
    render();
  });
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) refreshBtn.addEventListener('click', function(){
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('loadingWrap').style.display = 'flex';
    document.getElementById('loadingWrap').classList.remove('hide');
    loadData(true);
  });
}
function render() {
  if (viewMode === 'month') renderMonth();
  else if (viewMode === 'week') renderWeek();
  else renderDetail();
}
function showError(msg) {
  document.getElementById('loadingWrap').innerHTML = 
    '<div class="error-wrap">' +
    '<div>데이터를 불러오지 못했습니다.</div>' +
    '<div style="font-size:12px;margin-top:8px;">' + escapeHtml(msg) + '</div>' +
    '<button onclick="location.reload()">다시 시도</button>' +
    '</div>';
}
function loadData(forceRefresh) {
  const url = forceRefresh ? API_URL + '?refresh=1' : API_URL;
  fetch(url)
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      SCHEDULE_DATA = data;
      SCHEDULE_DATA.persons = SCHEDULE_DATA.persons.filter(function(p){ return RANK_OF[p]; });
      SCHEDULE_DATA.data = processData(SCHEDULE_DATA.data);
      ACTIVE = new Set(getActivePersonsForView());
      render();
      document.getElementById('appWrap').style.display = 'block';
      document.getElementById('loadingWrap').classList.add('hide');
      setTimeout(function() {
        document.getElementById('loadingWrap').style.display = 'none';
      }, 300);
    })
    .catch(function(err) {
      showError(err.message);
    });
}

function startApp() {
  document.getElementById('loadingWrap').style.display = 'flex';
  loadData();
}

loadTheme();
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('gateBtn').addEventListener('click', tryAuth);
document.getElementById('gateInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryAuth();
});

if (isAuthenticated()) {
  startApp();
} else {
  showGate();
}
</script>
</body>
